<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="nofollow, noindex">
    <title>Something went wrong - GlowinPress</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: #ef4444;
        }
        
        h1 {
            color: #1f2937;
            margin-bottom: 1rem;
            font-size: 2rem;
            font-weight: 700;
        }
        
        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        
        .error-code {
            background: #fef2f2;
            color: #dc2626;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.9rem;
            margin: 1rem 0;
            border: 1px solid #fecaca;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            border: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: white;
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        
        .brand {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        
        .brand strong {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💥</div>
        <h1>Oops! Something went wrong</h1>
        <p>
            We're sorry, but something unexpected happened. This could be due to a 
            network issue, browser compatibility, or a temporary server problem.
        </p>
        
        <div class="error-code" id="error-details">
            Error: Application failed to load
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="window.location.reload()">
                Try Again
            </button>
            <a href="/" class="btn btn-secondary">
                Go Home
            </a>
        </div>
        
        <div class="brand">
            <strong>Glowin'Press</strong> - We'll get this fixed soon
        </div>
    </div>

    <script>
        // Try to get more specific error information
        window.addEventListener('error', function(e) {
            const errorDetails = document.getElementById('error-details');
            errorDetails.textContent = `Error: ${e.message || 'Application failed to load'}`;
        });
        
        // Check if we can determine the specific error type
        const urlParams = new URLSearchParams(window.location.search);
        const errorType = urlParams.get('type');
        const errorDetails = document.getElementById('error-details');
        
        if (errorType === 'network') {
            errorDetails.textContent = 'Error: Network connection failed';
        } else if (errorType === 'chunk') {
            errorDetails.textContent = 'Error: Failed to load application resources';
        } else if (errorType === 'syntax') {
            errorDetails.textContent = 'Error: Invalid application code';
        }
    </script>
</body>
</html>
